apiVersion: v1
kind: Pod
metadata:
  generateName: teas-study-preflight-collector-
spec:
  restartPolicy: Never
  containers:
    - name: collector
      image: busybox:1.36
      command: ["sh", "-c", "while true; do sleep 3600; done"]
      resources:
        requests:
          cpu: "100m"
          memory: 64Mi
        limits:
          cpu: "500m"
          memory: 256Mi
      volumeMounts:
        - name: develop
          mountPath: /mnt/develop
  volumes:
    - name: develop
      persistentVolumeClaim:
        claimName: develop-pvc
