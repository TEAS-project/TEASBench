      max_num_seqs: "32"
      enable_auto_tool_choice: true

# --- swe-bench-lite: Vast.ai (Modal sandboxes, native to swe-rex) ----------
# No sandbox_provider/exec_provider at all: Modal is not a TEASBench-owned
# capability implementation the way the k8s provider is -- swe-rex talks to
# Modal directly (see docs/agentic-pipeline-design.md §5, "why no broker").
# SWEBENCH_HARNESS_MODAL=1 (which makes SWEBenchEvaluator.finalize pass
# `--modal true` to the grading harness) is exported by
# pipeline/vast/run_agentic_benchmarks.sh, not from here, since it is an env
# var read directly by AgentCAP rather than an agent_cap.agents CLI flag.
  - match:
      benchmark:
        - "swe-bench-lite"
      platform:
        - "vastai"
    agentic_client_flags:
      evaluator: "swebench"
      sweagent_deployment: "modal"
      # AgentCAP is baked into the Vast.ai image at /opt/AgentCAP (unlike
      # EIDF, which clones fresh into /dev/shm/AgentCAP at job start -- see
      # pipeline/vast/{sglang,vllm}/Dockerfile.agentic), so the path into its
      # checkout differs from the platform-independent rule's default above.
      task_indices: "/opt/AgentCAP/benchmarks/swe_bench_lite_curated_100.json"
      # SWE-agent is cloned, installed and streaming-patched at image build
      # time (Dockerfile.agentic), not cloned per run as on EIDF. Vast.ai bills
      # per GPU-hour, so a git clone plus `pip install -e` of SWE-agent,
      # swebench and modal at the start of every run is rented time burned on
      # setup. This must stay in step with the image.
      sweagent_dir: "/opt/swe_agent"
    extra_setup:
      value: |
        # Everything below is baked into the image; verify rather than redo it,
        # so a drift between this rule and Dockerfile.agentic fails loudly here
        # instead of silently running an unpatched SWE-agent (which yields a run
        # with empty streaming metrics -- the failure this check exists to catch).
        for mod in swerex swebench modal; do
          python -c "import $mod" || {
            echo "ERROR: $mod missing from the agentic image; rebuild it from pipeline/vast/*/Dockerfile.agentic." >&2
            exit 1
          }
        done

        [ -d /opt/swe_agent ] || {
          echo "ERROR: /opt/swe_agent not found; rebuild the agentic image." >&2
          exit 1
        }
        grep -q "AGENTCAP_STREAMING_PATCH_APPLIED" /opt/swe_agent/sweagent/agent/models.py || {
          echo "ERROR: SWE-agent at /opt/swe_agent is not streaming-patched; rebuild the agentic image." >&2
          exit 1
        }
    teas_env_exports:
      value: |
        export TEAS_BACKEND="swebench-modal"

