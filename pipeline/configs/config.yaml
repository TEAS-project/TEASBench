# This config file is consumed by template.py to construct
# substitutions for variables in template.yaml

########################
# VARIABLES & DEFAULTS #
########################


variables_defaults:

# Dict mapping engine-agnostic settings to actual flag names
# for each inference engine, and any default values for these flags
  server_flags:
    sglang:
      port:
        flag: "--port"
        value: "30000"
      reasoning_parser:
        flag: "--reasoning-parser"
      hf_model_path:
        flag: "--model-path"
      tensor_parallel_size:
        flag: "--tp-size"
      expert_recording:
        flag: "--expert-distribution-recorder-mode"
        value: "stat"
      batch_size:
        flag: "--max-running-requests"
      max_context:
        flag: "--context-length"
      model_load_timeout:
        flag: "--dist-timeout"
        value: "3600"
      gpu_memory_fraction:
        flag: "--mem-fraction-static"
      host:
        flag: "--host"
      trust_remote_code:
        flag: "--trust-remote-code"

    vllm:
      port:
        flag: "--port"
        value: "30000"
      host:
        flag: "--host"
        value: "0.0.0.0"
      reasoning_parser:
        flag: "--reasoning-parser"
      hf_model_path:
        flag: "--model"
      tensor_parallel_size:
        flag: "--tensor-parallel-size"
      batch_size:
        flag: "--max_num_seqs"
      max_context:
        flag: "--max-model-len"
      gpu_memory_fraction:
        flag: "--gpu_memory_utilization"
      kv_cache_dtype:
        flag: "--kv-cache-dtype"
      trust_remote_code:
        flag: "--trust-remote-code"

  client_flags:
    hf_model_path:
      flag: "--model_name"
    dataset:
      flag: "--datasets"
    num_samples:
      flag: "--num-samples"
    batch_size:
      flag: "--server-batch-size"
    api_url:
      flag: "--api-url"
      value: "http://localhost:30000/v1/completions"
    backend:
      flag: "--backend"
    chat_api:
      flag: "--use-chat-api"
    output_dir:
      flag: "--output_dir"
      value: "$RUN_DIR"
    judge_url:
      flag: "--judge-api-url"
    judge_model:                    
      flag: "--judge-model"
    judge_key:                      
      flag: "--judge-api-key"
    baseline_answers:               
      flag: "--baseline-answers-path"
    fixed_length_mode:
      flag: "--fixed-length-mode"
    input_length:
      flag: "--target-input-tokens"
      from_parameter: input_length
    output_length:
      flag: "--target-output-tokens"
      from_parameter: output_length
    profiling_only:
      flag: "--profiling-only"


  # Base settings 
  server_command:
    sglang:
      base_command: "python3 -m moe_cap.systems.sglang"
      flags:              
        - hf_model_path
        - port
        - expert_recording
        - tensor_parallel_size
    vllm:
      base_command: "python3 -m moe_cap.systems.vllm"
      flags:
        - hf_model_path
        - port
        - host
        - tensor_parallel_size

  # Base settings
  client_command:
    base_command: "python3 -m moe_cap.runner.openai_api_profile"
    flags:
      - hf_model_path
      - dataset
      - num_samples
      - api_url
      - backend
      - output_dir
      - input_length
      - output_length


  # Other variables needed to make up substitutions for template.yaml
  
  inference_engine_version:
      sglang: "0.5.9"
      vllm: "0.16.0"

  image:
    sglang:
      base: "lmsysorg/sglang"
    vllm:
      base: "vllm/vllm-openai"

  extra_container_env:
    value:
    
  download_arena_hard_baseline_answers:
    value:

  expert_distribution_copy_command:
    value:







  ###################
  # AGENTIC FAMILY  #
  ###################


  agentic_server_flags:
    # --- Model / endpoint ---
    hf_model_path:
      flag: "--model-path"             # sglang
    model_id:
      flag: "--model"                  # vllm
      from_parameter: hf_model_path
    host:
      flag: "--host"
      value: "127.0.0.1"
    port:
      flag: "--port"
      value: "8000"
    served_model_name:
      flag: "--served-model-name"
      value: "gpt-oss"
    tensor_parallel_size:
      flag: "--tensor-parallel-size"
    # --- Memory / capacity: no defaults, values are per-GPU (see rules) ---
    mem_fraction_static:
      flag: "--mem-fraction-static"    # sglang
    gpu_memory_utilization:
      flag: "--gpu-memory-utilization" # vllm
    max_num_seqs:
      flag: "--max-num-seqs"           # vllm
    kv_cache_dtype:
      flag: "--kv-cache-dtype"
    context_length:
      flag: "--context-length"         # sglang
      value: "131072"
    max_model_len:
      flag: "--max-model-len"          # vllm
      value: "131072"
    # --- gpt-oss harmony parsing: no defaults, see rules ---
    reasoning_parser:
      flag: "--reasoning-parser"
    tool_call_parser:
      flag: "--tool-call-parser"
    enable_auto_tool_choice:
      flag: "--enable-auto-tool-choice"  # vllm
    # --- Shared misc ---
    trust_remote_code:
      flag: "--trust-remote-code"
      value: true
    dtype:
      flag: "--dtype"
      value: "auto"
    enable_cache_report:
      flag: "--enable-cache-report"    # sglang
      value: true
    # --- SGLang-specific ---
    log_level:
      flag: "--log-level"
      value: "warning"
    random_seed:
      flag: "--random-seed"
      value: "42"
    chunked_prefill_size:
      flag: "--chunked-prefill-size"
      value: "16384"
    cuda_graph_max_bs:
      flag: "--cuda-graph-max-bs"
      value: "8"
    allow_auto_truncate:
      flag: "--allow-auto-truncate"
      value: true
    # --- vllm-specific ---
    seed:
      flag: "--seed"
      value: "42"
    stream_interval:
      flag: "--stream-interval"
      value: "1"
    async_scheduling:
      flag: "--async-scheduling"
      value: true
    disable_log_stats:
      flag: "--disable-log-stats"
      value: true
    enable_prefix_caching:
      flag: "--enable-prefix-caching"
      value: true

  imoanswerbench_server_command:
    sglang:
      base_command: "TRANSFORMERS_NO_TF=1 TRANSFORMERS_NO_FLAX=1 python -m sglang.launch_server"
      flags:
        - hf_model_path
        - host
        - port
        - log_level
        - served_model_name
        - context_length
        - mem_fraction_static
        - tensor_parallel_size
        - trust_remote_code
        - dtype
        - kv_cache_dtype
        - chunked_prefill_size
        - cuda_graph_max_bs
        - allow_auto_truncate
    vllm:
      base_command: "python -m vllm.entrypoints.openai.api_server"
      flags:
        - model_id
        - host
        - port
        - served_model_name
        - tensor_parallel_size
        - max_num_seqs
        - gpu_memory_utilization
        - max_model_len
        - dtype
        - kv_cache_dtype
        - stream_interval
        - tool_call_parser
        - async_scheduling
        - disable_log_stats
        - enable_prefix_caching
        - trust_remote_code

  mcpatlas_server_command:
    sglang:
      base_command: "TRANSFORMERS_NO_TF=1 TRANSFORMERS_NO_FLAX=1 python -m sglang.launch_server"
      flags:
        - hf_model_path
        - host
        - port
        - log_level
        - served_model_name
        - context_length
        - mem_fraction_static
        - tensor_parallel_size
        - trust_remote_code
        - dtype
        - kv_cache_dtype
        - chunked_prefill_size
        - cuda_graph_max_bs
        - allow_auto_truncate
    vllm:
      base_command: "python -m vllm.entrypoints.openai.api_server"
      flags:
        - model_id
        - host
        - port
        - served_model_name
        - tensor_parallel_size
        - max_num_seqs
        - gpu_memory_utilization
        - max_model_len
        - dtype
        - kv_cache_dtype
        - stream_interval
        - tool_call_parser
        - async_scheduling
        - disable_log_stats
        - enable_prefix_caching
        - trust_remote_code

  swebenchlite_vastai_server_command:
    sglang:
      base_command: "TRANSFORMERS_NO_TF=1 TRANSFORMERS_NO_FLAX=1 python -m sglang.launch_server"
      flags:
        - hf_model_path
        - host
        - port
        - log_level
        - served_model_name
        - context_length
        - mem_fraction_static
        - tensor_parallel_size
        - trust_remote_code
        - dtype
        - kv_cache_dtype
        - chunked_prefill_size
        - cuda_graph_max_bs
        - allow_auto_truncate
    vllm:
      base_command: "python -m vllm.entrypoints.openai.api_server"
      flags:
        - model_id
        - host
        - port
        - served_model_name
        - tensor_parallel_size
        - max_num_seqs
        - gpu_memory_utilization
        - max_model_len
        - dtype
        - kv_cache_dtype
        - stream_interval
        - tool_call_parser
        - async_scheduling
        - disable_log_stats
        - enable_prefix_caching
        - trust_remote_code


  # Mappings to possible agent_cap.agents client flags.
  agentic_client_flags:
    agents_config:
      flag: "--config"
    dataset:
      flag: "--dataset"
      from_parameter: benchmark   
    num_tasks:
      flag: "--num-tasks"
    task_indices:
      flag: "--task-indices"
    concurrency:
      flag: "--concurrency"
    output_dir:
      flag: "--output-dir"
      value: "$OUTPUT_ROOT"
    evaluator:
      flag: "--evaluator"
    strategy:
      flag: "--strategy"
    use_streaming:
      flag: "--use-streaming"
      value: true
    tool_backend:
      flag: "--tool-backend"
    mcp_server_url:
      flag: "--mcp-server-url"
    sweagent_deployment:
      flag: "--sweagent-deployment"
    sweagent_dir:
      flag: "--sweagent-dir"
    sweagent_image_repo:
      flag: "--sweagent-image-repo"
    sweagent_call_limit:
      flag: "--sweagent-call-limit"
    sandbox_provider:
      flag: "--sandbox-provider"
    exec_provider:
      flag: "--exec-provider"
    max_turns:
      flag: "--max-turns"
      value: "20"   # matches agent_cap.agents' own fallback; imo-answerbench overrides to 128

    # REDUNDANT?
    # (all four correspond to real agent_cap.agents flags) but never selected
    # by any benchmark's agentic_client_command.flags list below.
    # agents_config (--config) supplies the endpoint (name/base_url/api_key)
    # for all three benchmarks instead, and cli.py's single-agent quick
    # flags only fill in gaps the config file leaves unset (see
    # agent_cap/agents/cli.py:_build_agent_specs), so also passing these
    # would be redundant. hf_model_path has no CLI flag on agent_cap.agents
    # at all today -- @hf_model_path@ is used directly elsewhere in the
    # template instead (e.g. for TEAS_MODEL_NAME).
    model:
      flag: "--model"
    base_url:
      flag: "--base-url"
    api_key:
      flag: "--api-key"
    hf_model_path:
      flag: "--model-path"


  agentic_client_command:
    sglang:
      base_command: "python -m agent_cap.agents"
      flags:
        - dataset
        - num_tasks
        - concurrency
        - output_dir
    vllm:
      base_command: "python -m agent_cap.agents"
      flags:
        - dataset
        - num_tasks
        - concurrency
        - output_dir

  imoanswerbench_image:
    sglang:
      value: "ghcr.io/yufan196884/aimo3-sglang:pt2.9.1-cuda13-py312"
    vllm:
      value: "ghcr.io/yufan196884/imo-answerbench-env:latest"

  # AgentCAP checkout used by imo-answerbench. *_ref can be pinned to a
  # specific commit/tag for reproducibility; "main" (tracking the default
  # branch) matches this benchmark's original behaviour, which clones with
  # no ref pinning at all.
  imoanswerbench_repo:
    value: "github.com/Auto-CAP/AgentCAP.git"
  imoanswerbench_ref:
    value: "main"

  # Per-engine environment-setup script (inlined into the job at generation
  # time). sglang needs a torch/torchvision repair; vllm only needs a sanity
  # import check.
  imoanswerbench_env_setup_script:
    sglang:
      value: "scripts/setup_sglang_env.sh"
    vllm:
      value: "scripts/setup_vllm_env.sh"

  # sglang/vllm versions actually shipped in imoanswerbench_image (a
  # different image from the MoE inference_engine_version/image entries
  # above), read by agent_cap.agents.teas_output via TEAS_ENGINE_VERSION.
  imoanswerbench_inference_engine_version:
    sglang: "0.5.12.post1"
    vllm: "0.21.0"

  mcpatlas_image:
    sglang:
      value: "ghcr.io/yufan196884/aimo3-sglang:pt2.9.1-cuda13-py312"
    vllm:
      value: "ghcr.io/yufan196884/imo-answerbench-env:latest"

  # AgentCAP checkout used by mcp-atlas. Verbatim copy of imoanswerbench_*
  # today (both trace back to the same original shared block) -- not
  # necessarily correct for mcp-atlas specifically, unvalidated.
  mcpatlas_repo:
    value: "github.com/Auto-CAP/AgentCAP.git"
  mcpatlas_ref:
    value: "main"

  mcpatlas_env_setup_script:
    sglang:
      value: "scripts/setup_sglang_env.sh"
    vllm:
      value: "scripts/setup_vllm_env.sh"

  mcpatlas_inference_engine_version:
    sglang: "0.5.12.post1"
    vllm: "0.21.0"

  swebenchlite_vastai_image:
    sglang:
      value: "ghcr.io/teas-project/sglang-agentic:latest"
    vllm:
      value: "ghcr.io/teas-project/vllm-agentic:latest"

  swebenchlite_vastai_repo:
    value: "github.com/Auto-CAP/AgentCAP.git"
  swebenchlite_vastai_ref:
    value: "main"

  swebenchlite_vastai_env_setup_script:
    sglang:
      value: "scripts/setup_sglang_env.sh"
    vllm:
      value: "scripts/setup_vllm_env.sh"

  swebenchlite_vastai_inference_engine_version:
    sglang: "0.5.12.post1"
    vllm: "0.21.0"

  ###############################################
  # SWE-BENCH-LITE EIDF ENGINE-ONLY JOB (bare image)
  ###############################################
  # image/install-command/version/flags below are copied from the
  # validated swe-bench-lite EIDF runs recorded in
  # TEAS_Results_Private/agentic/eidf/{sglang,vllm}/gpt-oss-120b/swe-bench-lite/
  swebench_eidf_engine_image:
    value: "ghcr.io/pytorch/pytorch:2.10.0-cuda12.9-cudnn9-devel"

  swebench_eidf_engine_install_command:
    sglang:
      value: |
        apt-get update -qq && apt-get install -y -qq libnuma-dev > /dev/null 2>&1
        pip install --break-system-packages "sglang[all]==0.5.9" 2>&1 | tail -3
        python3 -c "import sglang; print('SGLang', sglang.__version__)"
    vllm:
      value: |
        pip install --break-system-packages vllm==0.19.0 2>&1 | tail -3
        python3 -c "import vllm; print('vLLM', vllm.__version__)"

  swebench_eidf_engine_server_command:
    sglang:
      base_command: "python3 -m sglang.launch_server"
      flags:
        - hf_model_path
        - served_model_name
        - host
        - port
        - context_length
        - enable_cache_report
    vllm:
      base_command: "vllm serve"
      flags:
        - model_id
        - served_model_name
        - host
        - port
        - max_model_len

  # Composable blocks referenced by pipeline/templates/agentic.yaml 
  # Each defaults to empty here, so a benchmark that doesn't need one renders an empty block;
  # rules below fill in the ones each benchmark actually needs.
  sidecar_containers:
    value:
  sidecar_wait:
    value:
  extra_setup:
    value:
  service_account:
    value:
  teas_env_exports:
    value:

  # For pipeline/vast/resolve_commands.py): there are no pod sidecars on Vast.ai,
  # so the tool server is started as a background process in the same
  # container instead. This variable carries only the "start it" step; the
  # "wait for it to be ready" step is deliberately NOT duplicated here -- it
  # is pure bash with no k8s-specific content, so both platforms reuse the
  # exact same sidecar_wait value (resolve_commands.py concatenates
  # tool_server_setup + sidecar_wait itself; see its docstring).
  tool_server_setup:
    value:




#########
# RULES #
#########

# Rules for conditional inclusion and values of variables depending on experiment parameters.
# 'match' keys are ANDed together; list values within a key are ORed.
# A match value can also be {not: [...]} to match when the parameter's value
# is NOT in the given list (or not equal, if a single scalar is given).
# server_flags / client_flags name canonical params (as defined above)
# and supply the value to pass to that flag.
rules:

#######################################
# Rules based on inference engine alone
#######################################

# always set SGLANG_EXPERT_DISTRIBUTION_RECORDER_DIR when# using sglang,
# even for dense models despite no expert activation recording, otherwise
# no core metrics
  - match:
      inference_engine:
        - "sglang"
    client_flags:
      backend: "sglang"
    extra_container_env:
      value: |
        - name: SGLANG_EXPERT_DISTRIBUTION_RECORDER_DIR
          value: "/dev/shm/sglang_expert_distribution_recorder"


  - match:
      inference_engine:
        - "vllm"
    client_flags:
      backend: "vllm"


# For SGLang need to set SGLANG_EXPERT_DISTRIBUTION_RECORDER_DIR
# to tell MoE-CAP to record expert distribution on server side. 
# Expert-distribution recording only makes sense for MoE models, 
# so exclude any non-MoE (e.g. dense models)
  - match:
      inference_engine:
        - "sglang"
      model:
        not:
          - "Qwen3-4B"
    expert_distribution_copy_command:
      value: |
        find "$SGLANG_EXPERT_DISTRIBUTION_RECORDER_DIR" -name 'expert_distribution_record.jsonl' -exec cp {} $RUN_DIR/ \; 2>/dev/null || true

  - match:
      model:
        not:
          - "Qwen3-4B"
          - "Qwen3-235B-A22B-Instruct-2507"
          - "Qwen3-235B-A22B-Instruct-2507-FP8"
      input_length:
        not:
          - "<defined>"
      output_length:
        not:
          - "<defined>"
    client_flags:
      chat_api: true



##################################
# Rules for non-MoE (dense) models
##################################

# For profiling only (no expert distribution recording)
# need to set MOE_CAP_PROFILING_ONLY for MoE-CAP to handle
# SGLang correctly:
  - match:
      inference_engine:
        - "sglang"
      model:
        - "Qwen3-4B"
    extra_container_env:
      value: |
        - name: MOE_CAP_PROFILING_ONLY
          value: "1"

# Omit expert-distribution-recording flag from server command
# and tell MoE-CAP client to profile only
  - match:
      model:
        - "Qwen3-4B"
    server_flags:
      expert_recording: null
    client_flags:
      profiling_only: true


#####################################
# Rules based on specific model alone
#####################################
  - match:
      model:
        - "DeepSeek-R1"
    server_flags:
      reasoning_parser: "deepseek_r1"

  - match:
      model:
        - "Kimi-K2.5"
    server_flags:
      reasoning_parser: "kimi_k2"

# Qwen3-4B is a dense model; run both engines' servers on localhost
  - match:
      model:
        - "Qwen3-4B"
    server_flags:
      host: "127.0.0.1"
      trust_remote_code: true
      reasoning_parser: "qwen3"

  - match: 
      model:
        - "Qwen3-235B-A22B-Instruct-2507-FP8"
        - "Qwen3-235B-A22B-Instruct-2507"
    server_flags:
      model_load_timeout: 3600

#################################
# Rules based on batch size alone
#################################
  - match:
      batch_size:
        - "1"
    server_flags:
      batch_size: "1"
    client_flags:
      batch_size: "1"

##############################
# Rules based on dataset alone
##############################
  - match: 
      dataset:
        - "arena-hard"
    client_flags:
      judge_url: "https://api.openai.com/v1/chat/completions"
      judge_model: "gpt-4.1"
      judge_key: "$OPENAI_API_KEY"
      baseline_answers: "$RUN_DIR/gpt-4-0613.jsonl"
    download_arena_hard_baseline_answers: "curl -L --output-dir $RUN_DIR -O https://raw.githubusercontent.com/lmarena/arena-hard-auto/main/data/arena-hard-v0.1/model_answer/gpt-4-0613.jsonl"
    extra_container_env:
      value: |
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: elm-openai-key-ap
              key: key

###############################
# Rules based on hardware alone
###############################
  - match:
      gpu:
        - "A100"
      image:
        cuda_variant: null

  - match:
      gpu:
        - "H100"
        - "H200"
      image:
        cuda_variant: "-cu130"

###########################################
# Rules based on model and inference engine
###########################################
  - match:
      model:
        - "gpt-oss-20b"
        - "gpt-oss-120b"
      inference_engine:
        - "sglang"
    server_flags:
      reasoning_parser: "gpt-oss"

  - match:
      model:
        - "gpt-oss-20b"
        - "gpt-oss-120b"
      inference_engine:
        - "vllm"
    server_flags:
      reasoning_parser: "openai_gptoss"

#########################################################################
# Memory requirement tweaks for models that only barely fit in GPU memory
#########################################################################
  - match:
      model:
        - "gpt-oss-120b"
      gpu:
        - "H100"
      num_gpu:
        - 1
      batch_size:
        - "default"
      inference_engine:
        - "sglang"
    server_flags:
      gpu_memory_fraction: "0.9"

  - match:
      model:
        - "gpt-oss-120b"
      dataset:
        - "gsm8k"
        - "arena-hard"
      gpu:
        - "H100"
      num_gpu:
        - 1
      batch_size:
        - "default"
      inference_engine:
        - "vllm"
    server_flags:
      gpu_memory_fraction: "0.92"

  - match:
      model:
        - "gpt-oss-120b"
      dataset:
        - "longbench_v1"
      gpu:
        - "H100"
      num_gpu:
        - 1
      batch_size:
        - "default"
      inference_engine:
        - "vllm"
    server_flags:
      gpu_memory_fraction: "0.94"

  - match:
      model:
        - "Qwen3-235B-A22B-Instruct-2507-FP8"
        - "Qwen3-235B-A22B-Instruct-2507"
      inference_engine:
        - "vllm"
      gpu:
        - "H100"
    server_flags:
      max_context: "200k"

  - match:
      model:
        - "Qwen3-235B-A22B-Instruct-2507-FP8"
        - "Qwen3-235B-A22B-Instruct-2507"
      inference_engine:
        - "vllm"
      gpu:
        - "H200"
    server_flags:
      max_context: "200k"
      kv_cache_dtype: "fp8_e4m3"

###################
# Fixed-length mode
###################
# Forced-length runs profile only. Two reasons, both measured: on vLLM the
# non-profiling path routes through the expert recorder, which reports a decode
# token count unrelated to the forced length (zero, or a pass count); and a
# judge scoring output padded to the target length produces a number that means
# nothing, at real API cost.
  - match:
      input_length: "<defined>"
    client_flags:
      fixed_length_mode: true
      profiling_only: true
      chat_api: null

  - match:
      output_length: "<defined>"
    client_flags:
      fixed_length_mode: true
      profiling_only: true
      chat_api: null


####################
# AGENTIC FAMILY   #
####################
# Matched on 'benchmark' (imo-answerbench / mcp-atlas / swe-bench-lite),
# and on 'platform' where that matters. Every existing MoE rule above this
# point is untouched.

# Agentic: KV-cache dtype depends on GPU memory headroom. A100 runs in full
# precision; H100/H200 quantise the KV cache to fp8. One rule pair per
# benchmark rather than one rule listing all three, so each benchmark's value
# can be corrected independently once its own runs are validated.
# swe-bench-lite here means Vast.ai specifically (the all-in-one shape); EIDF
# swe-bench-lite's kv_cache_dtype is set by its own engine-only rules further
# down instead, which intentionally use different, individually-validated
# per-GPU values (see there for why).
  - match:
      benchmark: ["imo-answerbench"]
      gpu: ["A100"]
    agentic_server_flags:
      kv_cache_dtype: "auto"

  - match:
      benchmark: ["imo-answerbench"]
      gpu: ["H100", "H200"]
    agentic_server_flags:
      kv_cache_dtype: "fp8_e4m3"

  - match:
      benchmark: ["mcp-atlas"]
      gpu: ["A100"]
    agentic_server_flags:
      kv_cache_dtype: "auto"

  - match:
      benchmark: ["mcp-atlas"]
      gpu: ["H100", "H200"]
    agentic_server_flags:
      kv_cache_dtype: "fp8_e4m3"

  - match:
      benchmark: ["swe-bench-lite"]
      platform: ["vastai"]
      gpu: ["A100"]
    agentic_server_flags:
      kv_cache_dtype: "auto"

  - match:
      benchmark: ["swe-bench-lite"]
      platform: ["vastai"]
      gpu: ["H100", "H200"]
    agentic_server_flags:
      kv_cache_dtype: "fp8_e4m3"


# Agentic all-in-one: memory/capacity/parser values. These were previously
# inline defaults duplicated into each benchmark's own copy of the flag
# definitions; they live here as per-benchmark rules now so the definitions
# stay pure vocabulary and each benchmark's value can move independently.
# Every rule is scoped by inference_engine because a rule-set override renders
# regardless of the command's `flags` list (see build_command), so an unscoped
# mem_fraction_static would leak --mem-fraction-static into a vllm command.
# EIDF swe-bench-lite is absent by design: its engine-only path gets these
# from the individually-validated per-(model, gpu, num_gpu) rules further down.
  - match:
      benchmark: ["imo-answerbench"]
      inference_engine: ["sglang"]
    agentic_server_flags:
      mem_fraction_static: "0.85"

  - match:
      benchmark: ["imo-answerbench"]
      inference_engine: ["vllm"]
    agentic_server_flags:
      gpu_memory_utilization: "0.85"
      max_num_seqs: "256"
      tool_call_parser: "openai"

  - match:
      benchmark: ["mcp-atlas"]
      inference_engine: ["sglang"]
    agentic_server_flags:
      mem_fraction_static: "0.85"

  - match:
      benchmark: ["mcp-atlas"]
      inference_engine: ["vllm"]
    agentic_server_flags:
      gpu_memory_utilization: "0.85"
      max_num_seqs: "256"
      tool_call_parser: "openai"

  - match:
      benchmark: ["swe-bench-lite"]
      platform: ["vastai"]
      inference_engine: ["sglang"]
    agentic_server_flags:
      mem_fraction_static: "0.85"

  - match:
      benchmark: ["swe-bench-lite"]
      platform: ["vastai"]
      inference_engine: ["vllm"]
    agentic_server_flags:
      gpu_memory_utilization: "0.85"
      max_num_seqs: "256"
      tool_call_parser: "openai"


# --- imo-answerbench ---------------------------------------------------
# agents_config is engine-specific (endpoint protocol/engine differ), so it
# is set per (benchmark, inference_engine); everything else is shared across
# both engines and set once below.
  # agents_config path prefix is platform-specific: EIDF clones TEASBench
  # fresh into /dev/shm at job runtime, while Vast.ai bakes pipeline/configs
  # into the image at /opt/teasbench (see pipeline/vast/{sglang,vllm}/Dockerfile*)
  # -- so each (benchmark, engine) pair needs one rule per platform. platform
  # defaults to "eidf" for CSVs that predate the column (see utils.py), which
  # covers every existing EIDF experiments CSV.
  - match:
      benchmark:
        - "imo-answerbench"
      inference_engine:
        - "sglang"
      platform:
        - "eidf"
    agentic_client_flags:
      agents_config: "/dev/shm/TEASBench/pipeline/configs/agents/imo-answerbench_gptoss_sglang.yaml"

  - match:
      benchmark:
        - "imo-answerbench"
      inference_engine:
        - "vllm"
      platform:
        - "eidf"
    agentic_client_flags:
      agents_config: "/dev/shm/TEASBench/pipeline/configs/agents/imo-answerbench_gptoss_vllm.yaml"

  - match:
      benchmark:
        - "imo-answerbench"
      inference_engine:
        - "sglang"
      platform:
        - "vastai"
    agentic_client_flags:
      agents_config: "/opt/teasbench/pipeline/configs/agents/imo-answerbench_gptoss_sglang.yaml"

  - match:
      benchmark:
        - "imo-answerbench"
      inference_engine:
        - "vllm"
      platform:
        - "vastai"
    agentic_client_flags:
      agents_config: "/opt/teasbench/pipeline/configs/agents/imo-answerbench_gptoss_vllm.yaml"

  - match:
      benchmark:
        - "imo-answerbench"
    agentic_client_flags:
      evaluator: "imo"
      strategy: "single"
      max_turns: 128
    # no sidecar, no extra setup -- the composable blocks default to empty


# --- mcp-atlas -----------------------------------------------------------
  - match:
      benchmark:
        - "mcp-atlas"
      inference_engine:
        - "sglang"
      platform:
        - "eidf"
    agentic_client_flags:
      agents_config: "/dev/shm/TEASBench/pipeline/configs/agents/mcp-atlas_gptoss_sglang.yaml"

  - match:
      benchmark:
        - "mcp-atlas"
      inference_engine:
        - "vllm"
      platform:
        - "eidf"
    agentic_client_flags:
      agents_config: "/dev/shm/TEASBench/pipeline/configs/agents/mcp-atlas_gptoss_vllm.yaml"

  - match:
      benchmark:
        - "mcp-atlas"
      inference_engine:
        - "sglang"
      platform:
        - "vastai"
    agentic_client_flags:
      agents_config: "/opt/teasbench/pipeline/configs/agents/mcp-atlas_gptoss_sglang.yaml"

  - match:
      benchmark:
        - "mcp-atlas"
      inference_engine:
        - "vllm"
      platform:
        - "vastai"
    agentic_client_flags:
      agents_config: "/opt/teasbench/pipeline/configs/agents/mcp-atlas_gptoss_vllm.yaml"

  - match:
      benchmark:
        - "mcp-atlas"
    agentic_client_flags:
      strategy: "single"
      tool_backend: "mcp"
      mcp_server_url: "http://127.0.0.1:1984"
      use_streaming: true
      evaluator: "gtfa"
      max_turns: 20
    # One fixed tool-server sidecar in the same pod (port 1984). Secrets are
    # referenced by name (mcp-atlas-github-token / mcp-atlas-brave-api-key) --
    # never inlined -- see pipeline/README.md for what must exist in the
    # cluster.
    sidecar_containers:
      value: |
        - name: mcp-atlas-sidecar
          image: ghcr.io/scaleapi/mcp-atlas:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              python3 -c "
              import httpx
              if not hasattr(httpx, 'TimeoutError'):
                  httpx.TimeoutError = httpx.TimeoutException
              import site, os
              sc = os.path.join(site.getsitepackages()[0], 'sitecustomize.py')
              os.makedirs(os.path.dirname(sc), exist_ok=True)
              with open(sc, 'w') as f:
                  f.write('import httpx\nif not hasattr(httpx, \"TimeoutError\"): httpx.TimeoutError = httpx.TimeoutException\n')
              print('httpx.TimeoutError patched')
              "
              # NOT `exec`: the server runs in the background so this script can
              # wait for the main container's shutdown sentinel and then exit.
              #
              # A Job pod with restartPolicy: Never only reaches Succeeded when
              # EVERY container has terminated. A tool server that runs forever
              # therefore keeps the pod Running after the benchmark is done, the
              # Job never completes, and the GPU stays allocated indefinitely --
              # ttlSecondsAfterFinished cannot help, because it only starts once
              # the Job has finished. (Kubernetes >= 1.29 solves this natively with
              # sidecar initContainers, restartPolicy: Always, which are excluded
              # from the completion calculation; this sentinel is the portable
              # equivalent for clusters below that.)
              /agent-environment/entrypoint.sh uv run python -m uvicorn agent_environment.main:app --host 0.0.0.0 --port 1984 &
              MCP_PID=$!

              while kill -0 $MCP_PID 2>/dev/null; do
                  if [ -f /var/run/teasbench/main-container-done ]; then
                      echo "Main container finished; shutting the tool server down."
                      kill $MCP_PID 2>/dev/null || true
                      wait $MCP_PID 2>/dev/null || true
                      exit 0
                  fi
                  sleep 2
              done
              echo "Tool server exited on its own (pid $MCP_PID)." >&2
              exit 1
          workingDir: /agent-environment
          ports:
            - containerPort: 1984
          env:
            - name: ENABLED_SERVERS
              value: "arxiv,brave-search,calculator,cli-mcp-server,clinicaltrialsgov-mcp-server,context7,ddg-search,desktop-commander,fetch,filesystem,git,github,mcp-code-executor,mcp-server-code-runner,memory,met-museum,open-library,osm-mcp-server,pubmed,weather,whois,wikipedia"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-atlas-github-token
                  key: token
            - name: BRAVE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-atlas-brave-api-key
                  key: key
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              cpu: "4"
              memory: 16Gi
          volumeMounts:
            - mountPath: /var/run/teasbench
              name: sidecar-signal
    sidecar_wait:
      value: |
        echo "Waiting for MCP Atlas sidecar..."
        mcp_ready=0
        for i in $(seq 1 120); do
          if curl -sf -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:1984/list-tools > /dev/null 2>&1; then
            echo "MCP Atlas sidecar ready after ${i}s"
            mcp_ready=1
            break
          fi
          sleep 1
        done
        if [ $mcp_ready -eq 0 ]; then
          echo "MCP Atlas sidecar did not become ready within 120s." >&2
          exit 1
        fi
    # GTFAEvaluatorAdapter.__init__ (agent_cap/agents/evaluators.py) discards
    # every constructor kwarg, so the judge: block in mcp-atlas_gptoss_*.yaml
    # is NOT what actually configures the judge for evaluator=gtfa --
    # agent_cap.evaluators.gtfa_eval.GTFAEvaluator reads EVAL_LLM_MODEL /
    # EVAL_LLM_BASE_URL / EVAL_LLM_API_KEY from the environment directly (see
    # docs/agentic-pipeline-design.md). Point it at the same Gemini endpoint
    # imo-answerbench's judge already uses, reusing the GEMINI_API_KEY
    # container env var (from the gemini-api-key secret) rather than a
    # second copy of it.
    extra_setup:
      value: |
        export EVAL_LLM_MODEL="gemini-3.1-flash-lite"
        export EVAL_LLM_BASE_URL="https://generativelanguage.googleapis.com/v1beta/openai"
        export EVAL_LLM_API_KEY="$GEMINI_API_KEY"
    teas_env_exports:
      value: |
        export TEAS_BACKEND="mcp-atlas-localmcp"
    # Vast.ai only (see pipeline/vast/resolve_commands.py): no sidecar
    # container exists there, so start the same MCP Atlas server
    # (AgentCAP-teasbench/mcp-server/start.sh) as a background process
    # instead. EIDF ignores this variable entirely (it renders sidecar_containers
    # into the pod spec instead); resolve_commands.py is the only reader of
    # tool_server_setup, and it never reads sidecar_containers.
    tool_server_setup:
      value: |
        # start.sh needs an .env and exits 1 without one; write_mcp_env.sh turns
        # the Vast.ai instance secrets into that file. ENABLED_SERVERS is pinned
        # to the same 22-server list the EIDF sidecar uses (see
        # utils.MCP_ENABLED_SERVERS, and the parity test in
        # tests/test_mcp_env.py) -- the server set *is* the benchmark, so the two
        # platforms drifting apart would silently make their numbers
        # incomparable.
        bash /opt/teasbench/pipeline/scripts/write_mcp_env.sh \
          /opt/AgentCAP/third_party/mcp-atlas \
          "arxiv,brave-search,calculator,cli-mcp-server,clinicaltrialsgov-mcp-server,context7,ddg-search,desktop-commander,fetch,filesystem,git,github,mcp-code-executor,mcp-server-code-runner,memory,met-museum,open-library,osm-mcp-server,pubmed,weather,whois,wikipedia"

        MCP_DATA_DIR=/dev/shm/mcp_data
        mkdir -p "$MCP_DATA_DIR"
        MCP_DATA_DIR="$MCP_DATA_DIR" MCP_PORT=1984 MCP_SKIP_PREINSTALL=1 \
          bash /opt/AgentCAP/mcp-server/start.sh > "$RUN_DIR/mcp_server.log" 2>&1 &
        MCP_PID=$!

        # Block until the server answers, or fail this row. Without this the
        # client would start firing at a server still cloning repos and building
        # venvs, and every tool call in the first minutes would error -- scoring
        # as bad model behaviour rather than as the setup race it is.
        echo "Waiting for MCP Atlas server on :1984..."
        mcp_ready=0
        for i in $(seq 1 600); do
          if ! kill -0 $MCP_PID 2>/dev/null; then
            echo "ERROR: MCP Atlas server died during startup. Log:" >&2
            cat "$RUN_DIR/mcp_server.log" >&2
            exit 1
          fi
          if curl -sf http://127.0.0.1:1984/health > /dev/null 2>&1; then
            echo "MCP Atlas server ready after ${i}s"
            mcp_ready=1
            break
          fi
          sleep 1
        done
        if [ $mcp_ready -eq 0 ]; then
          echo "ERROR: MCP Atlas server not ready within 600s. Log:" >&2
          cat "$RUN_DIR/mcp_server.log" >&2
          exit 1
        fi


# --- swe-bench-lite --------------------------------------------------------
  - match:
      benchmark:
        - "swe-bench-lite"
      inference_engine:
        - "sglang"
      platform:
        - "eidf"
    agentic_client_flags:
      # No agents config file on this path. The driver reaches the engine over a
      # port-forward on an OS-assigned local port, so the endpoint cannot be
      # baked into a file; it is passed as --base-url instead (see the eidf
      # swe-bench rule below). Leaving a --config here would be actively
      # dangerous: agent_cap.agents only applies the --base-url/--model quick
      # flags when --config has not already defined the 'agent' role, so the
      # agent would silently talk to the file's hardcoded 127.0.0.1:8000 rather
      # than the tunnel. "" omits the flag.
      agents_config: ""

  - match:
      benchmark:
        - "swe-bench-lite"
      inference_engine:
        - "vllm"
      platform:
        - "eidf"
    agentic_client_flags:
      # No agents config file on this path. The driver reaches the engine over a
      # port-forward on an OS-assigned local port, so the endpoint cannot be
      # baked into a file; it is passed as --base-url instead (see the eidf
      # swe-bench rule below). Leaving a --config here would be actively
      # dangerous: agent_cap.agents only applies the --base-url/--model quick
      # flags when --config has not already defined the 'agent' role, so the
      # agent would silently talk to the file's hardcoded 127.0.0.1:8000 rather
      # than the tunnel. "" omits the flag.
      agents_config: ""

  - match:
      benchmark:
        - "swe-bench-lite"
      inference_engine:
        - "sglang"
      platform:
        - "vastai"
    agentic_client_flags:
      agents_config: "/opt/teasbench/pipeline/configs/agents/swe-bench-lite_gptoss_sglang.yaml"

  - match:
      benchmark:
        - "swe-bench-lite"
      inference_engine:
        - "vllm"
      platform:
        - "vastai"
    agentic_client_flags:
      agents_config: "/opt/teasbench/pipeline/configs/agents/swe-bench-lite_gptoss_vllm.yaml"

  # Platform-independent: what the benchmark is, regardless of how the
  # sandbox substrate is provided. sweagent_deployment / evaluator /
  # sandbox_provider / exec_provider / service_account / extra_setup /
  # teas_env_exports all vary by *platform* (how), not by benchmark (what),
  # so they live in the two platform-scoped rules below instead -- see
  # §3 ("Two platforms") of docs/agentic-pipeline-design.md.
  - match:
      benchmark:
        - "swe-bench-lite"
    agentic_client_flags:
      strategy: "sweagent"
      task_indices: "/dev/shm/AgentCAP/benchmarks/swe_bench_lite_curated_100.json"
      sweagent_dir: "/dev/shm/swe_agent"
      sweagent_image_repo: ""
      sweagent_call_limit: 200
      # No max_turns here, deliberately: confirmed by grepping
      # strategies_sweagent.py that the sweagent strategy never reads
      # self.max_turns (only the built-in single/sequential/supervisor
      # strategies in strategies.py do), and the historical validated runs
      # (AgentCAP/scripts/run_swebench_k8s_100.sh) never passed --max-turns
      # either. The real limit for this strategy is sweagent_call_limit
      # above, passed straight through to SWE-agent's own
      # --agent.model.per_instance_call_limit. Omitting the flag here
      # matches that validated recipe instead of asserting a value that's
      # silently never consulted.

# --- swe-bench-lite: EIDF (k8s sandbox provider) ---------------------------
# platform defaults to "eidf" for CSVs that predate the 'platform' column
# (utils.build_params / generate.py p.setdefault), which covers every
# existing swe-bench-lite-eidf.csv / smoke_tests_agentic.csv row.
  - match:
      benchmark:
        - "swe-bench-lite"
      platform:
        - "eidf"
    agentic_client_flags:
      evaluator: "swebench-k8s"
      sweagent_deployment: "k8s"
      # EIDF does not grant pods RBAC, so the in-cluster provider is unusable
      # here: the driver runs on a login node with the user's own credentials
      # and reaches each sandbox over `kubectl port-forward`. See
      # utils.needs_login_node_driver and docs/DEVELOPER_GUIDE.md 5.
      sandbox_provider: "teasbench.sandbox.k8s:PortForwardK8sProvider"
      exec_provider: "teasbench.sandbox.k8s:PortForwardK8sProvider"
      # The driver runs on a login node, not in a pod, so every path the
      # platform-independent rule above set to an in-pod location (/dev/shm/...)
      # has to become something the driver defines. These are shell variables
      # exported by templates/agentic-driver.sh; changing a name there without
      # changing it here silently breaks the run.
      task_indices: "$AGENTCAP_DIR/benchmarks/swe_bench_lite_curated_100.json"
      sweagent_dir: "$SWEAGENT_DIR"
      output_dir: "$RUN_DIR"
      # The engine is reached through a port-forward on an OS-assigned local
      # port, so the endpoint cannot be baked into a config file the way the
      # in-pod benchmarks do it. Passed on the CLI instead, which also means
      # this path needs no agents config file at all -- matching what AgentCAP's
      # own run_swebench_k8s_100.sh did. "" omits the flag entirely.
      agents_config: ""
      base_url: "$LLM_URL"
      api_key: "dummy"
      # Must match agentic_server_flags.served_model_name (this is the
      # EIDF engine-only path); litellm needs the openai/ prefix to route to
      # an OpenAI-compatible endpoint.
      model: "openai/gpt-oss"
    # Needed so InClusterK8sProvider (imported from TEASBench, on
    # PYTHONPATH=/dev/shm/TEASBench) can create/watch/delete the per-task
    # swe-rex sandbox Jobs and exec into the eval containers. Requires
    # eidf/rbac/teasbench-runner-rbac.yaml to have been applied once in the
    # namespace -- see pipeline/README.md.
    service_account:
      value: "serviceAccountName: teasbench-runner"
    extra_setup:
      value: |
        echo "Installing kubectl..."
        KUBECTL_VERSION=$(curl -L -s https://dl.k8s.io/release/stable.txt)
        curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
        install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
        rm -f kubectl

        # In-cluster kubeconfig, using this pod's own ServiceAccount
        # (teasbench-runner, mounted automatically by k8s).
        SA_DIR=/var/run/secrets/kubernetes.io/serviceaccount
        kubectl config set-cluster in-cluster --server=https://kubernetes.default.svc --certificate-authority="$SA_DIR/ca.crt"
        kubectl config set-credentials in-cluster --token="$(cat $SA_DIR/token)"
        kubectl config set-context in-cluster --cluster=in-cluster --user=in-cluster --namespace="${TEASBENCH_K8S_NAMESPACE:-eidf230ns}"
        kubectl config use-context in-cluster
        kubectl get pods > /dev/null

        pip install --quiet 'swe-rex>=1.4.0' swebench

        echo "Cloning SWE-agent..."
        rm -rf /dev/shm/swe_agent
        git clone https://github.com/SWE-agent/SWE-agent.git /dev/shm/swe_agent
        pip install -e /dev/shm/swe_agent

        python /dev/shm/AgentCAP/scripts/patch_sweagent_streaming.py /dev/shm/swe_agent
        grep -q "AGENTCAP_STREAMING_PATCH_APPLIED" /dev/shm/swe_agent/sweagent/agent/models.py || {
          echo "ERROR: SWE-agent streaming patch marker not found after patching." >&2
          exit 1
        }
    teas_env_exports:
      value: |
        export TEAS_BACKEND="swebench-k8s"

# --- swe-bench-lite: EIDF engine-only Job, harmony parsers -----------------
# gpt-oss's harmony tool-call/reasoning format is what needs these parsers,
# not the engine or swe-bench-lite as such -- so both rules are scoped to the
# model family, and a hypothetical non-gpt-oss model run through this same
# engine-only path inherits neither. Each engine spells the same harmony
# parser differently: sglang registers a detector literally named "gpt-oss"
# (function_call_parser.py / reasoning_parser.py), while vLLM calls its
# equivalent tool-call parser "openai" and auto-enables its reasoning parser
# for gpt-oss without being asked. Both cover gpt-oss-120b (the validated
# model) and gpt-oss-20b (quick smoke tests) -- the format is shared across
# the family, not tied to a size.
  - match:
      benchmark: ["swe-bench-lite"]
      inference_engine: ["sglang"]
      model: ["gpt-oss-120b", "gpt-oss-20b"]
    agentic_server_flags:
      reasoning_parser: "gpt-oss"
      tool_call_parser: "gpt-oss"

  - match:
      benchmark: ["swe-bench-lite"]
      inference_engine: ["vllm"]
      model: ["gpt-oss-120b", "gpt-oss-20b"]
    agentic_server_flags:
      tool_call_parser: "openai"

# --- swe-bench-lite: EIDF engine-only Job launch flags ---------------------
# GPU-specific values for agentic_server_flags on the EIDF engine-only path, copied verbatim from
# the validated swe-bench-lite EIDF runs in
# TEAS_Results_Private/agentic/eidf/{sglang,vllm}/gpt-oss-120b/swe-bench-lite/.
# tensor_parallel_size only appears on A100 and H100 (num_gpu 2); H200
# runs on a single GPU, matching history. kv_cache_dtype is omitted entirely
# on A100 for both engines, matching history (not even "auto"). num_gpu is
# matched explicitly (not inferred from gpu) so a row that pairs a validated
# GPU type with an unvalidated GPU count (e.g. A100 x1, never run historically)
# falls through with none of these flags set, rather than silently applying a
# tensor-parallel-size that doesn't fit the pod's actual GPU count
# Every validated run these values come from served gpt-oss-120b, so a different
# model (e.g. gpt-oss-20b, used for quick smoke tests) falls through to the engine's
# own defaults rather than silently inheriting memory/parallelism settings tuned
# for a model of a different size.
  - match:
