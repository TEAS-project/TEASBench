# This config file is consumed by template.py to construct
# substitutions for variables in template.yaml

########################
# VARIABLES & DEFAULTS #
########################


variables_defaults:

# Dict mapping engine-agnostic settings to actual flag names
# for each inference engine, and any default values for these flags
  server_flags:
    sglang:
      port:
        flag: "--port"
        value: "30000"
      reasoning_parser:
        flag: "--reasoning-parser"
      hf_model_path:
        flag: "--model-path"
      tensor_parallel_size:
        flag: "--tp-size"
      expert_recording:
        flag: "--expert-distribution-recorder-mode"
        value: "stat"
      batch_size:
        flag: "--max-running-requests"
      max_context:
        flag: "--context-length"
      model_load_timeout:
        flag: "--dist-timeout"
        value: "3600"
      gpu_memory_fraction:
        flag: "--mem-fraction-static"
    vllm:
      port:
        flag: "--port"
        value: "30000"
      host:
        flag: "--host"
        value: "0.0.0.0"
      reasoning_parser:
        flag: "--reasoning-parser"
      hf_model_path:
        flag: "--model"
      tensor_parallel_size:
        flag: "--tensor-parallel-size"
      expert_recording:
        flag: "--enable-expert-distribution-metrics"
        value: true
      batch_size:
        flag: "--max_num_seqs"
      max_context:
        flag: "--max-model-len"
      gpu_memory_fraction:
        flag: "--gpu_memory_utilization"

  client_flags:
    hf_model_path:
      flag: "--model_name"
    dataset:
      flag: "--datasets"
    num_samples:
      flag: "--num-samples"
    batch_size:
      flag: "--server-batch-size"
    api_url:
      flag: "--api-url"
      value: "http://localhost:30000/v1/completions"
    backend:
      flag: "--backend"
    chat_api:
      flag: "--use-chat-api"
      value: true
    output_dir:
      flag: "--output_dir"
      value: "$RUN_DIR"
    judge_url:
      flag: "--judge-api-url"
    judge_model:                    
      flag: "--judge-model"
    judge_key:                      
      flag: "--judge-api-key"
    baseline_answers:               
      flag: "--baseline-answers-path"
    fixed_length_mode:
      flag: "--fixed-length-mode"
    input_length:
      flag: "--target-input-tokens"
      from_parameter: input_length
    output_length:
      flag: "--target-output-tokens"
      from_parameter: output_length


  # Base settings 
  server_command:
    sglang:
      base_command: "python3 -m moe_cap.systems.sglang"
      flags:              
        - hf_model_path
        - port
        - expert_recording
        - tensor_parallel_size
    vllm:
      base_command: "python3 -m moe_cap.systems.vllm"
      flags:
        - hf_model_path
        - port
        - host
        - expert_recording
        - tensor_parallel_size

  # Base settings
  client_command:
    base_command: "python3 -m moe_cap.runner.openai_api_profile"
    flags:
      - hf_model_path
      - dataset
      - num_samples
      - api_url
      - backend
      - chat_api
      - output_dir
      - input_length
      - output_length


  ###################
  # AGENTIC FAMILY  #
  ###################
  # sglang path: the pipeline launches SGLang as a separate background server
  # (agentic_server_command) and then runs agent_cap.agents --config
  # (agentic_command.sglang). The config file is versioned in TEASBench at
  # pipeline/configs/agents/imo_gptoss_sglang.yaml and committed into AgentCAP
  # at configs/agents_imo_gptoss120b_sglang.yaml so it is available inside the
  # container at /dev/shm/AgentCAP/configs/agents_imo_gptoss120b_sglang.yaml.
  #
  # Both sglang and vllm now use agent_cap.agents with a separate server process.
  # agentic_server_flags contains entries for both engines; each engine's
  # agentic_server_command.flags list selects only the relevant ones.

  agentic_server_flags:
    # --- Shared ---
    hf_model_path:
      flag: "--model-path"       # sglang: --model-path <hf_id>
    model_id:
      flag: "--model"
      from_parameter: hf_model_path   # vllm: --model <hf_id>
    host:
      flag: "--host"
      value: "127.0.0.1"
    port:
      flag: "--port"
      value: "8000"
    served_model_name:
      flag: "--served-model-name"
      value: "gpt-oss"
    tensor_parallel_size:
      flag: "--tensor-parallel-size"
    trust_remote_code:
      flag: "--trust-remote-code"
      value: true
    dtype:
      flag: "--dtype"
      value: "auto"
    kv_cache_dtype:
      flag: "--kv-cache-dtype"
      # value supplied per-GPU by rules below (A100 -> auto, H100/H200 -> fp8_e4m3)
    # --- SGLang-specific ---
    log_level:
      flag: "--log-level"
      value: "warning"
    context_length:
      flag: "--context-length"
      value: "131072"
    mem_fraction_static:
      flag: "--mem-fraction-static"
      value: "0.85"
    random_seed:
      flag: "--random-seed"
      value: "42"
    chunked_prefill_size:
      flag: "--chunked-prefill-size"
      value: "16384"
    cuda_graph_max_bs:
      flag: "--cuda-graph-max-bs"
      value: "8"
    allow_auto_truncate:
      flag: "--allow-auto-truncate"
      value: true
    # --- vllm-specific ---
    seed:
      flag: "--seed"
      value: "42"
    max_num_seqs:
      flag: "--max-num-seqs"
      value: "256"
    gpu_memory_utilization:
      flag: "--gpu-memory-utilization"
      value: "0.85"
    max_model_len:
      flag: "--max-model-len"
      value: "131072"
    stream_interval:
      flag: "--stream-interval"
      value: "1"
    tool_call_parser:
      flag: "--tool-call-parser"
      value: "openai"
    async_scheduling:
      flag: "--async-scheduling"
      value: true
    disable_log_stats:
      flag: "--disable-log-stats"
      value: true
    enable_prefix_caching:
      flag: "--enable-prefix-caching"
      value: true

  agentic_server_command:
    sglang:
      base_command: "TRANSFORMERS_NO_TF=1 TRANSFORMERS_NO_FLAX=1 python -m sglang.launch_server"
      flags:
        - hf_model_path
        - host
        - port
        - log_level
        - served_model_name
        - context_length
        - mem_fraction_static
        - tensor_parallel_size
        - random_seed
        - trust_remote_code
        - dtype
        - kv_cache_dtype
        - chunked_prefill_size
        - cuda_graph_max_bs
        - allow_auto_truncate
    vllm:
      base_command: "python -m vllm.entrypoints.openai.api_server"
      flags:
        - model_id
        - host
        - port
        - served_model_name
        - tensor_parallel_size
        - seed
        - max_num_seqs
        - gpu_memory_utilization
        - max_model_len
        - dtype
        - kv_cache_dtype
        - stream_interval
        - tool_call_parser
        - async_scheduling
        - disable_log_stats
        - enable_prefix_caching
        - trust_remote_code

  # Flags shared across agentic commands (sglang client + vllm all-in-one).
  agentic_flags:
    run_model:
      flag: "--model"
      value: "gpt-oss"
    num_tasks:
      flag: "--num-tasks"
      value: "25"
    seed:
      flag: "--seed"
      value: "42"
    max_turns:
      flag: "--max-turns"
      value: "128"
    max_tokens:
      flag: "--max-tokens"
      value: "131072"
    temperature:
      flag: "--temperature"
      value: "1.0"
    top_p:
      flag: "--top-p"
      value: "1.0"
    startup_timeout:
      flag: "--startup-timeout"
      value: "30"
    exec_timeout:
      flag: "--exec-timeout"
      value: "5"
    preload:
      flag: "--preload"
      value: "minimal"
    auto_print_last_expr:
      flag: "--auto-print-last-expr"
      value: true
    port:
      flag: "--port"
      value: "8000"
    host:
      flag: "--host"
      value: "127.0.0.1"
    served_model_name:
      flag: "--served-model-name"
      value: "gpt-oss"
    hf_model_path:
      flag: "--model-path"
    kv_cache_dtype:
      flag: "--kv-cache-dtype"
      # value supplied per-GPU by rules below (A100 -> auto, H100/H200 -> fp8_e4m3)
    dtype:
      flag: "--dtype"
      value: "auto"
    stream_interval:
      flag: "--stream-interval"
      value: "1"
    context_tokens:
      flag: "--context-tokens"
      value: "131072"
    gpu_memory_utilization:
      flag: "--gpu-memory-utilization"
      value: "0.85"
    mem_fraction_static:        # sglang only
      flag: "--mem-fraction-static"
      value: "0.85"
    run_batch_size:             # vllm only (--batch-size); not the MoE batch_size
      flag: "--batch-size"
      value: "256"
    tensor_parallel_size:
      flag: "--tensor-parallel-size"
    server_timeout:
      flag: "--server-timeout"
      value: "3600"
    preload_workers:
      flag: "--preload-workers"
      value: "8"
    chunked_prefill_size:
      flag: "--chunked-prefill-size"
      value: "16384"
    cuda_graph_max_bs:
      flag: "--cuda-graph-max-bs"
      value: "8"
    log_level:
      flag: "--log-level"
      value: "warning"
    judge_model:
      flag: "--judge-model"
      value: "google/gemini-3.1-flash-lite-preview"
    # agent_cap.agents --config path (engine-specific config files)
    agents_config_file_sglang:
      flag: "--config"
      value: "/dev/shm/TEASBench/pipeline/configs/agents/imo_gptoss_sglang.yaml"
    agents_config_file_vllm:
      flag: "--config"
      value: "/dev/shm/TEASBench/pipeline/configs/agents/imo_gptoss_vllm.yaml"
    output_dir:
      flag: "--output-dir"
      value: "$OUTPUT_ROOT"

  # Both engines now use agent_cap.agents with a separate server process.
  # Sampling params live in the per-engine config file; num_tasks and
  # output_dir are the only per-row overrides passed on the CLI.
  agentic_command:
    sglang:
      base_command: "python -m agent_cap.agents"
      flags:
        - agents_config_file_sglang
        - num_tasks
        - output_dir
    vllm:
      base_command: "python -m agent_cap.agents"
      flags:
        - agents_config_file_vllm
        - num_tasks
        - output_dir

  agentcap_image:
    sglang:
      value: "ghcr.io/yufan196884/aimo3-sglang:pt2.9.1-cuda13-py312"
    vllm:
      value: "ghcr.io/yufan196884/imo-answerbench-env:latest"  

  # Per-engine environment-setup script (inlined into the job at generation time).
  # sglang needs a torch/torchvision repair; vllm only needs a sanity import check.
  agentic_env_setup_script:
    sglang:
      value: "scripts/setup_sglang_env.sh"
    vllm:
      value: "scripts/setup_vllm_env.sh"
  agentcap_repo:
    value: "github.com/Auto-CAP/AgentCAP.git"
  agentcap_ref:
    value: "arno/gemini-judge-endpoint"

  # Other variables needed to make up substitutions for template.yaml
  
  inference_engine_version:
      sglang: "0.5.9"
      vllm: "0.16.0"

  image:
    sglang:
      base: "lmsysorg/sglang"
    vllm:
      base: "vllm/vllm-openai"

  extra_container_env:
    value:
    
  download_arena_hard_baseline_answers:
    value: 




#########
# RULES #
#########

# Rules for conditional inclusion and values of variables depending on experiment parameters.
# 'match' keys are ANDed together; list values within a key are ORed.
# server_flags / client_flags name canonical params (as defined above)
# and supply the value to pass to that flag.
rules:


# Rules based on inference engine alone
  - match:
      inference_engine:
        - "sglang"
    extra_container_env:
      value: |
        - name: SGLANG_EXPERT_DISTRIBUTION_RECORDER_DIR
          value: "/dev/shm/sglang_expert_distribution_recorder"
    client_flags:
      backend: "sglang"

  - match:
      inference_engine:
        - "vllm"
    client_flags:
      backend: "vllm"
        

# Rules based on model alone
  - match:
      model:
        - "DeepSeek-R1"
    server_flags:
      reasoning_parser: "deepseek_r1"

  - match:
      model:
        - "Kimi-K2.5"
    server_flags:
      reasoning_parser: "kimi_k2"

  - match: 
      model:
        - "Qwen3-235B-A22B-Instruct-2507-FP8"
        - "Qwen3-235B-A22B-Instruct-2507"
    server_flags:
      model_load_timeout: 3600


# Rules based on batch size alone
  - match:
      batch_size:
        - "1"
    server_flags:
      batch_size: "1"
    client_flags:
      batch_size: "1"

# Rules based on dataset alone
  - match: 
      dataset:
        - "arena-hard"
    client_flags:
      judge_url: "https://api.openai.com/v1/chat/completions"
      judge_model: "gpt-4.1"
      judge_key: "$OPENAI_API_KEY"
      baseline_answers: "$RUN_DIR/gpt-4-0613.jsonl"
    download_arena_hard_baseline_answers: "curl -L --output-dir $RUN_DIR -O https://raw.githubusercontent.com/lmarena/arena-hard-auto/main/data/arena-hard-v0.1/model_answer/gpt-4-0613.jsonl"
    extra_container_env:
      value: |
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: elm-openai-key-ap
              key: key


# Rules based on hardware alone
  - match:
      gpu:
        - "A100"
      image:
        cuda_variant: null

  - match:
      gpu:
        - "H100"
        - "H200"
      image:
        cuda_variant: "-cu130"


# Agentic: KV-cache dtype depends on GPU memory headroom.
# A100 runs in full precision; H100/H200 quantise the KV cache to fp8.
# Both sglang and vllm now run a separate server process, so the dtype
# is always set in agentic_server_flags (never in agentic_flags).

  - match:
      benchmark:
        - "imo-answerbench"
      gpu:
        - "A100"
    agentic_server_flags:
      kv_cache_dtype: "auto"

  - match:
      benchmark:
        - "imo-answerbench"
      gpu:
        - "H100"
        - "H200"
    agentic_server_flags:
      kv_cache_dtype: "fp8_e4m3"


# Rules based on model and inference engine
  - match:
      model:
        - "gpt-oss-20b"
        - "gpt-oss-120b"
      inference_engine:
        - "sglang"
    server_flags:
      reasoning_parser: "gpt-oss"

  - match:
      model:
        - "gpt-oss-20b"
        - "gpt-oss-120b"
      inference_engine:
        - "vllm"
    server_flags:
      reasoning_parser: "openai_gptoss"


# Memory requirement tweaks for models that only barely fit in GPU memory
  - match:
      model:
        - "gpt-oss-120b"
      gpu:
        - "H100"
      num_gpu:
        - 1
      batch_size:
        - "default"
      inference_engine:
        - "sglang"
    server_flags:
      gpu_memory_fraction: "0.9"

  - match:
      model:
        - "gpt-oss-120b"
      dataset:
        - "gsm8k"
        - "arena-hard"
      gpu:
        - "H100"
      num_gpu:
        - 1
      batch_size:
        - "default"
      inference_engine:
        - "vllm"
    server_flags:
      gpu_memory_fraction: "0.92"

  - match:
      model:
        - "gpt-oss-120b"
      dataset:
        - "longbench_v1"
      gpu:
        - "H100"
      num_gpu:
        - 1
      batch_size:
        - "default"
      inference_engine:
        - "vllm"
    server_flags:
      gpu_memory_fraction: "0.94"

  - match:
      model:
        - "Qwen3-235B-A22B-Instruct-2507-FP8"
        - "Qwen3-235B-A22B-Instruct-2507"
      inference_engine:
        - "vllm"
      gpu:
        - "H100"
    server_flags:
      max_context: 200k

      
# Activate fixed-length mode
  - match:
      input_length: "<defined>"
    client_flags:
      fixed_length_mode: true

  - match:
      output_length: "<defined>"
    client_flags:
      fixed_length_mode: true

