strategy: single
dataset: imo-answerbench
num_tasks: 25
max_turns: 128
tool_backend: math-python
evaluator: imo

agents:
  agent:
    name: gpt-oss
    # Harmony protocol with vLLM requires v1 as part of the base URL.
    base_url: http://127.0.0.1:8000/v1
    api_key: EMPTY
    protocol: harmony
    engine: vllm
    max_tokens: 131072
    temperature: 1.0
    top_p: 1.0

judge:
  name: gemini-3.1-flash-lite
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  api_key: ${GEMINI_API_KEY}

