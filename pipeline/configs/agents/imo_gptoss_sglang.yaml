strategy: single
dataset: imo-answerbench
num_tasks: 25
max_turns: 128
tool_backend: math-python
evaluator: imo

agents:
  agent:
    name: gpt-oss
    base_url: http://127.0.0.1:8000
    api_key: EMPTY
    protocol: harmony
    engine: sglang
    max_tokens: 131072
    temperature: 1.0
    top_p: 1.0
    seed: 42

judge:
  name: google/gemini-3.1-flash-lite-preview
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  api_key: ${GEMINI_API_KEY}

output_dir: results/imo_gptoss_sglang
