# Endpoint + sampling params for the mcp-atlas benchmark. Everything else
# (strategy, tool_backend, mcp_server_url, evaluator, num_tasks, task_indices,
# concurrency, output_dir, ...) is passed on the CLI via agentic_client_flags
# -- see pipeline/configs/config.yaml.
agents:
  agent:
    name: gpt-oss
    # The openai protocol posts to <base_url>/chat/completions, so /v1 must be
    # part of base_url here (the harmony protocol's native /completions
    # endpoint was the opposite: rooted at the server root, no /v1).
    base_url: http://127.0.0.1:8000/v1
    api_key: EMPTY
    protocol: openai
    engine: vllm
    max_tokens: 131072
    temperature: 1.0
    top_p: 1.0

# Post AgentCAP PR #63, these are passed through the GTFAEvalutorAdapter.
judge:
  name: google/gemini-3.1-flash-lite
  base_url: https://openrouter.ai/api/v1
  api_key: ${OPENROUTER_API_KEY}
