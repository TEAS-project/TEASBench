apiVersion: batch/v1
kind: Job
metadata:
  generateName: @name_k8s@-
  labels:
    kueue.x-k8s.io/queue-name:  @k8s_queue@
spec:
  completions: 1
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      containers:
      - name: @inference_engine@-server
        image: @image_name@
        imagePullPolicy: IfNotPresent
        env:
          - name: k8s_job_name
            valueFrom:
              fieldRef:
                fieldPath: metadata.labels['job-name']
          - name: k8s_node_name
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: HF_HOME
            value: /mnt/input/hf_cache
          - name: TEAS_OUTPUT_DIR
            value: /mnt/develop/outputs
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: teas-develop-results-private-ap
                key: token
          @extra_container_env@
        command: ["/bin/bash", "-c"]
        args:
          - |
            job_start_time=$(date +%s)

            timestamp=$( date +%Y%m%d-%H%M )
            RUN_DIR=/dev/shm/$timestamp
            mkdir -p $RUN_DIR
            
            exec &> $RUN_DIR/stdout_stderr.log

            echo "Running on node $k8s_node_name"
            
            env_start_time=$(date +%s)
            
            apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout="30" update
            apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout="30" -y install git
            git clone  https://github.com/Auto-CAP/MoE-CAP.git /dev/shm/MoE-CAP
            cd /dev/shm/MoE-CAP
            @moe_cap_pin@
            MOE_CAP_COMMIT=$(git rev-parse --short HEAD)
            pip install -e .
            pip install gputil
            apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout="30" -y install jq
            
            env_end_time=$(date +%s)
            env_duration=$((env_end_time - env_start_time))
            echo "Environment setup took $env_duration seconds"
            jq -n --arg env_duration $env_duration '{environment_setup: $env_duration}'  >> $RUN_DIR/timings.json

            @download_arena_hard_baseline_answers@

            server_init_start_time=$(date +%s)

            # Start server
            echo "Initialising server"
            @server_start_command@ &> $RUN_DIR/server.log &
            SERVER_PID=$!
            
            # Wait until the /health endpoint returns HTTP 200
            echo "Waiting for server to be ready..." 

            until curl -s -f http://localhost:30000/health > /dev/null; do
                # Check if the server has crashed (if so the health check will never succeed)
                if ! kill -0 "$SERVER_PID" 2> /dev/null; then
                    echo -e "\n[ERROR] Server process died before becoming ready to use."
                    SERVER_STATUS="dead"
                    break
                fi

                echo -n "."
                sleep 2
            done

            if [ "$SERVER_STATUS" != "dead" ]; then
                server_init_end_time=$(date +%s)
                server_init_duration=$((server_init_end_time - server_init_start_time))
                echo "Server is ready!"
                echo "Server initialisation took $server_init_duration seconds"
                jq -n --arg server_init_duration $server_init_duration '{server_initialisation: $server_init_duration}'  >> $RUN_DIR/timings.json
                echo "Starting to run benchmark (sending http requests)..."

                if [ -n "$OPENAI_API_KEY" ]; then
                    OPENAI_API_KEY="${OPENAI_API_KEY%$'\n'}"
                    export OPENAI_API_KEY
                fi


                # Start client
                client_start_time=$(date +%s)
                @client_run_command@ &> $RUN_DIR/client.log
                CLIENT_SUCCESS=$?  # not 100% robust, could be failed redirection

                if [ "$CLIENT_SUCCESS" == 0 ]; then
                    echo "Benchmark run finished"
                    client_end_time=$(date +%s)
                    client_duration=$((client_end_time - client_start_time))
                    echo "Client took $client_duration seconds" 
                    jq -n --arg client_duration $client_duration '{client: $client_duration}'  >> $RUN_DIR/timings.json
                else
                    echo "Client crashed"
                fi
                echo "Shutting down server..."  # regardless of client success
                kill $SERVER_PID
                wait $SERVER_PID
            else
                echo "Not starting client because server is not available"
            fi            


            ##################
            # Saving results #
            ##################

            # Tidy up - gather MoE-CAP generated results from subdir
            cd $RUN_DIR
            cp @hf_model_path@/* .
            rm -r `dirname @hf_model_path@`
            mv metadata*.json metadata.json
            mv metrics*.json metrics.json
            mv detailed_results* detailed_results.jsonl
            mv output_data*.jsonl output_data.jsonl
            @expert_distribution_copy_command@
                        
            echo "Server stopped. Copying files to pvc..."

            # Archive EVERYTHING to the PVC first, before any git operation, so the data
            # survives regardless of what happens with the results repo.
            PVC_RUN_OUTPUT_DIR=$TEAS_OUTPUT_DIR/@pvc_archive_dir@/@output_repo_dir@/$timestamp
            mkdir -p $PVC_RUN_OUTPUT_DIR
            cp -R $RUN_DIR/* $PVC_RUN_OUTPUT_DIR/
            cp /mnt/shared/job-configs/${k8s_job_name}.yaml $PVC_RUN_OUTPUT_DIR/
            rm /mnt/shared/job-configs/${k8s_job_name}.yaml

            # We've also moved our log so change where we are writing
            exec &>> $PVC_RUN_OUTPUT_DIR/stdout_stderr.log
            cd $PVC_RUN_OUTPUT_DIR

            echo "Files copied to pvc at $PVC_RUN_OUTPUT_DIR"

            # Add commit IDs of MoE-CAP and TEASBench to metadata.json (on the PVC copy)
            jq --arg moe_cap_commit $MOE_CAP_COMMIT '.system_environment += {"teasbench_commit": "@teasbench_commit@", "moe_cap_commit": $moe_cap_commit}' $PVC_RUN_OUTPUT_DIR/metadata.json > tmp.json && mv tmp.json $PVC_RUN_OUTPUT_DIR/metadata.json
            @study_metadata_enrichment@

            job_end_time=$(date +%s)
            job_duration=$((job_end_time - job_start_time))
            echo "Job took $job_duration seconds"
            jq -n --arg job_duration $job_duration '{job: $job_duration}'  >> $PVC_RUN_OUTPUT_DIR/timings.json

            #############################################
            # Publish curated subset to results repo    #
            #############################################
            # The PVC directory above is a pure archive shared by every job on this PVC and is
            # never a git working tree. All git work happens in a throwaway clone in /dev/shm so
            # that a fresh checkout can never collide with another job's untracked archive files,
            # and concurrent pushes are handled by retrying with a rebase rather than by locking.
            # --filter=blob:none makes it a partial clone so blobs for the repo's whole
            # accumulated history of prior runs are never downloaded -- sparse-checkout alone
            # only stops them being written to the working tree, not fetched.
            GIT_TOKEN="${GIT_TOKEN%$'\n'}"   # remove trailing newline that causes issues
            REPO_URL="https://oauth2:${GIT_TOKEN}@github.com/TEAS-project/@results_repo@.git"
            CLONE=/dev/shm/@results_repo@
            PUBLISH_SUBDIR="@output_repo_dir@/$timestamp"

            rm -rf "$CLONE"
            if ! { git clone --quiet --branch main --single-branch --depth 1 --filter=blob:none --no-checkout "$REPO_URL" "$CLONE" \
                   && git -C "$CLONE" sparse-checkout init --cone \
                   && git -C "$CLONE" checkout --quiet main \
                   && git -C "$CLONE" sparse-checkout add "$PUBLISH_SUBDIR"; }; then
                echo "RESULTS PUBLISH FAILED: could not clone results repo; data is in $PVC_RUN_OUTPUT_DIR"
            else
                git -C "$CLONE" config user.email "autopush@eidf"
                git -C "$CLONE" config user.name "Pipeline Autopush"

                LOCAL_RUN_OUTPUT_DIR="$CLONE/$PUBLISH_SUBDIR"
                mkdir -p "$LOCAL_RUN_OUTPUT_DIR"

                # Copy ONLY the files we publish, and copy them from the PVC archive: metadata.json
                # has just been enriched with the commit IDs, timings.json has just had the job
                # duration appended, and the job yaml exists only there -- none of that is in $RUN_DIR.
                shopt -s nullglob
                publish_files=( $PVC_RUN_OUTPUT_DIR/metrics*.json \
                                $PVC_RUN_OUTPUT_DIR/metadata*.json \
                                $PVC_RUN_OUTPUT_DIR/*.yaml \
                                $PVC_RUN_OUTPUT_DIR/timings.json \
                                $PVC_RUN_OUTPUT_DIR/expert_distribution_record*.jsonl )
                shopt -u nullglob
                if [ ${#publish_files[@]} -gt 0 ]; then
                    cp "${publish_files[@]}" "$LOCAL_RUN_OUTPUT_DIR"/
                fi

                # The clone's run dir contains only the files copied above, so -A stages exactly
                # the intended subset and cannot abort the way a non-matching pathspec does.
                git -C "$CLONE" add -A -- "$PUBLISH_SUBDIR"

                if git -C "$CLONE" diff --cached --quiet; then
                    echo "RESULTS PUBLISH FAILED: nothing staged for $PUBLISH_SUBDIR; data is in $PVC_RUN_OUTPUT_DIR"
                else
                    git -C "$CLONE" commit -q -m "auto: @name_k8s@"
                    PUSHED=0
                    for attempt in 1 2 3 4 5 6; do
                        if git -C "$CLONE" push -q "$REPO_URL" HEAD:main; then PUSHED=1; break; fi
                        echo "push attempt $attempt rejected; rebasing onto origin/main"
                        git -C "$CLONE" pull --rebase -q "$REPO_URL" main || break
                        sleep $(( (RANDOM % 20) + 5 ))
                    done
                    if [ $PUSHED -eq 1 ]; then
                        echo "RESULTS PUBLISHED to $PUBLISH_SUBDIR"
                    else
                        echo "RESULTS PUBLISH FAILED after retries; data is in $PVC_RUN_OUTPUT_DIR"
                    fi
                fi
                rm -rf "$CLONE"
            fi

            echo "Finalising container"
        ports:
          - containerPort: 30000 
        resources:
          requests:
            cpu: 10
            memory: '100Gi'
          limits:
            cpu: 10
            memory: '100Gi'
            nvidia.com/gpu: @num_gpu@
        volumeMounts:
          - mountPath: /mnt/develop
            name: develop
          - mountPath: /mnt/input
            name: inputs
          - mountPath: /dev/shm
            name: dshm
          - mountPath: /mnt/shared
            name: shared
      restartPolicy: Never
      volumes:
        - name: inputs
          persistentVolumeClaim:
            claimName: @pvc_inputs@
        - name: develop
          persistentVolumeClaim:
            claimName: @pvc_develop@
        - name: shared
          persistentVolumeClaim:
            claimName: @pvc_shared@
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
      nodeSelector:
        nvidia.com/gpu.product: @gpu_product@ 
