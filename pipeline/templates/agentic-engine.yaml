# Engine-only Job: serves the model on GPUs and nothing else.
#
# Generated alongside a driver script for benchmarks that cannot run the client
# inside the cluster -- currently SWE-bench Lite on EIDF, where pods are not
# granted the RBAC needed to provision per-task sandboxes
#
# The driver submits this, port-forwards to it, runs the benchmark against it,
# and deletes it on exit. It is never submitted by hand.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: @name_k8s@-engine-
  labels:
    app: @name_k8s@-engine
    kueue.x-k8s.io/queue-name: @k8s_queue@
spec:
  completions: 1
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  # The engine runs until the driver deletes it. This is only a backstop, so a
  # driver that dies without running its trap cannot hold GPUs indefinitely.
  activeDeadlineSeconds: 86400
  template:
    metadata:
      labels:
        app: @name_k8s@-engine
    spec:
      restartPolicy: Never
      containers:
      - name: @inference_engine@-engine
        image: @image_name@
        imagePullPolicy: IfNotPresent
        env:
          - name: k8s_node_name
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: HF_HOME
            value: /mnt/input/hf_cache
          - name: PIP_CACHE_DIR
            value: /mnt/input/pip_cache
          @extra_container_env@
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -euo pipefail
            echo "Engine starting on node $k8s_node_name"

            mkdir -p /mnt/input/hf_cache /mnt/input/pip_cache

            @agentic_env_setup@

            # Patch the engine's own install before it starts, where a stock
            # engine has a defect that would corrupt the measurement. Empty
            # for every row that has no such patch; see
            # engine_pre_launch_script in pipeline/configs/config.yaml.
            @engine_pre_launch@

            # Binding to the container's loopback is fine: `kubectl port-forward`
            # forwards into the pod's own network namespace, so 127.0.0.1 here is
            # reachable from the driver. (A k8s Service would need 0.0.0.0; this
            # deliberately does not use one.)
            echo "Launching @inference_engine@..."
            @agentic_server_command@
        ports:
          - containerPort: 8000
        resources:
          requests:
            cpu: "8"
            memory: "64Gi"
            nvidia.com/gpu: @num_gpu@
          limits:
            cpu: "8"
            memory: "64Gi"
            nvidia.com/gpu: @num_gpu@
        volumeMounts:
          - mountPath: /mnt/input
            name: inputs
          - mountPath: /dev/shm
            name: dshm
      volumes:
        - name: inputs
          persistentVolumeClaim:
            claimName: @pvc_inputs@
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
      nodeSelector:
        nvidia.com/gpu.product: @gpu_product@
